# CI：PR 与主干推送的最小门禁（不含分层测试，测试体系另行规划）
# 口径：类型检查 → 构建 → 既有 selfcheck 断言 → 发布清单核对
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Selfcheck（解析 / 渲染 / 序列化断言）
        run: node dev/selfcheck.mjs

      - name: Pack dry-run（核对发布清单）
        run: npm pack --dry-run
